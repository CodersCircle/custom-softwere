name: build-sd-dumper
on:
  push:
    branches: [dumper-build]
    paths: ['sd-dumper/*.sh', 'sd-dumper/*.env', '.github/workflows/build-sd-dumper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi bc bison flex libssl-dev device-tree-compiler \
            python3-setuptools python3-dev python3-pyelftools swig libgnutls28-dev uuid-dev
      - name: Build read-only dumper
        run: |
          mkdir -p sd-dumper/out
          set -o pipefail
          bash sd-dumper/build.sh 2>&1 | tee sd-dumper/out/build.log
      - name: Commit output back to branch
        if: always()
        run: |
          git config user.name "dumper-ci"
          git config user.email "dumper-ci@users.noreply.github.com"
          tail -c 200000 sd-dumper/out/build.log > sd-dumper/out/build.tail.log || true
          rm -f sd-dumper/out/build.log
          git add sd-dumper/out
          git commit -m "ci: dumper build output (${{ job.status }}) [skip ci]" || true
          git push
